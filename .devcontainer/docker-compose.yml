services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      mysql:
        condition: service_healthy
      metabase:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: synthetic-demo-root
      MYSQL_DATABASE: financial_customer_demo
    volumes:
      - mysql_data:/var/lib/mysql
      - ../demo/setup_mysql.sql:/tmp/setup_mysql.sql:ro
      - ./init/00-metabase.sql:/docker-entrypoint-initdb.d/00-metabase.sql:ro
      - ./init/01-seed.sh:/docker-entrypoint-initdb.d/01-seed.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: mysql
      MB_DB_HOST: mysql
      MB_DB_PORT: 3306
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: metabase_app
      MB_DB_PASS: synthetic-demo-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mysql_data:
